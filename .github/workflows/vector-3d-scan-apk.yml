name: Build Vector 3D Scan APK

on:
  push:
    branches: [vector-3d-scan-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract scanner source
        shell: bash
        run: |
          mkdir -p scanner-app
          tar -xzf scanner-app-source.tgz -C scanner-app

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKM="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: scanner-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vector3DScan-APK
          path: scanner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
