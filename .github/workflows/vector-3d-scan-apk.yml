name: Build Vector 3D Scan APK

on:
  push:
    branches: [vector-3d-scan-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract scanner source
        shell: bash
        run: |
          mkdir -p scanner-app
          tar -xzf scanner-app-source.tgz -C scanner-app
          sed -i 's/import com.google.ar.core.NotYetAvailableException/import com.google.ar.core.exceptions.NotYetAvailableException/' scanner-app/app/src/main/java/com/vector/scan3d/PointCloudFusion.kt
          sed -i 's/val hint=TextView(this).apply{/val hintText=TextView(this).apply{/' scanner-app/app/src/main/java/com/vector/scan3d/MainActivity.kt
          sed -i 's/box.addView(hint);box.addView(spinner);box.addView(input)/box.addView(hintText);box.addView(spinner);box.addView(input)/' scanner-app/app/src/main/java/com/vector/scan3d/MainActivity.kt
          sed -i 's/val input=EditText(this).apply{hint=/val input=EditText(this).apply{this.hint=/' scanner-app/app/src/main/java/com/vector/scan3d/MainActivity.kt
      
      - name: Apply v1.4 visual-mask sources
        shell: bash
        run: |
          set -euo pipefail
          echo '299c8e77f9d40f5a9d5d06903b1c6503a8ccaebcd9c7780157300fc6036c540f  scanner-v14-overlay.tgz' > /tmp/v14.sha256
          base64 --decode scanner-v14-overlay.b64 > scanner-v14-overlay.tgz
          sha256sum -c /tmp/v14.sha256
          tar -xzf scanner-v14-overlay.tgz -C scanner-app
          grep -q 'versionName = "1.4.0"' scanner-app/app/build.gradle.kts
          test -f scanner-app/app/src/main/java/com/vector/scan3d/MaskEngine.kt
          test -f scanner-app/app/src/main/java/com/vector/scan3d/MaskAnalyzer.kt
          test -f scanner-app/app/src/main/java/com/vector/scan3d/MaskOverlayView.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scanner-app/app/src/main/java/com/vector/scan3d/ScanRenderer.kt")
          src = p.read_text()
          original_raw = "fusion.integrateRawDepth(frame, anchor.pose)"
          original_sparse = "fusion.integrateFeaturePoints(frame, anchor.pose)"
          assert original_raw in src and original_sparse in src, "Firma de la versión 1.4 no coincide"
          new_call = "fusion.integrateHybridDepth(frame, anchor.pose).added"
          src = src.replace(original_raw, new_call).replace(original_sparse, new_call)
          p.write_text(src)
          PY



      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKM="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: scanner-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vector3DScan-v1.4-APK
          path: scanner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
